    threshold: 100% test suite pass rate
    blocks: [DEC-003, DEC-004]
    owner: mgamil.dev@gmail.com

  - id: GATE-004
    question: Does the SVG world map rasterization complete in < 150ms and does the RTS minimap maintain >= 30 FPS with click-to-navigate camera viewport bounds?
    reduces: UNC-004
    hardness: hard
