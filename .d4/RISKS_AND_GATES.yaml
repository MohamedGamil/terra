      rubric: Measure SVG rasterization duration and minimap frame rate under camera drag operations.
      blind_scored: false
      stop_rules: Stop benchmark after 500 minimap update operations.
      tie_is_failure: true
    threshold: World map generation < 150ms and Minimap update FPS >= 30 FPS
    blocks: [DEC-005, DEC-006]
    owner: mgamil.dev@gmail.com

  - id: GATE-005
    question: Does the high-detail GeoJSON world map rasterizer produce > 350,000 land pixels with accurate coastlines and does click gesture accuracy reach 100%?
    reduces: UNC-005
    hardness: hard
    status: passed
    protocol:
      frozen: true
      fixtures: GeoJSON map generation & Mouse gesture disambiguation test suite.
      rubric: Deterministic land density count and click vs drag event firing assertions.
      blind_scored: false
      stop_rules: Stop benchmark after test suite completion.
      tie_is_failure: true
    threshold: GeoJSON land pixels > 350,000 and Click accuracy = 100%
    blocks: [DEC-007, DEC-008]
    owner: mgamil.dev@gmail.com

risks:
  - id: RISK-001
    risk: Network bandwidth saturation from broadcasting full map state every tick instead of delta-encoded updates.
    early_signal: Server outgoing network throughput > 2 MB/s for 50 connected clients.
    response: Implement binary delta encoding (bitmask of modified pixel coordinates) and spatial interest management.
    kill_criterion: Inability to keep bandwidth < 100 KB/s per client in full 500-player lobby.
    status: open
    owner: mgamil.dev@gmail.com
