# DECISIONS.yaml — accepted, proposed, rejected, and superseded decisions (SPEC §15).
decisions:
  - id: DEC-001
    statement: Architecture tech stack for Terra MVP (TypeScript + HTML5 Canvas frontend, Node.js + WebSockets backend).
    state: accepted
    kind: architecture
    boundary: Applies to Terra MVP core engine and networking.
    gate: GATE-001
    options_considered:
      - option: TypeScript + HTML5 2D Canvas + Node.js WebSockets
        verdict: selected
        rationale: High browser accessibility, zero heavy plugin overhead, fast canvas pixel buffer manipulation.
      - option: Unity WebGL / C#
        verdict: rejected
        rationale: Heavy bundle size, longer load times, less suitable for custom fast pixel grid manipulation.

  - id: DEC-002
    statement: Territory Ownership & Expansion Data Structure (Uint32Array Bitset Grid with Delta Synchronization).
    state: accepted
    kind: architecture
    boundary: Core game state representation in memory and network format.
    gate: GATE-002
    options_considered:
      - option: Flat Uint32Array 1000x1000 grid buffer with delta coordinate packets
        verdict: selected
        rationale: Direct memory alignment, fast canvas ImageData transfer, minimal network serialization cost.
      - option: Object graph / quadtree per player
        verdict: rejected
        rationale: Higher memory allocation churn during high-frequency expansion ticks.

  - id: DEC-003
    statement: Client Game Flow State Machine (LOBBY -> SPAWN_PICK -> PLAYING -> GAME_OVER).
    state: accepted
    kind: product
    boundary: Client UX lifecycle and session state transitions.
    gate: GATE-003
    options_considered:
      - option: Explicit 4-phase state machine
        verdict: selected
        rationale: Matches authentic Territorial.io game lobby, spawn selection phase, and post-match screens.
      - option: Direct auto-spawn into active game
        verdict: rejected
        rationale: Lacks player spawn location choice and lobby customization.

  - id: DEC-004
    statement: Player Attack Vector Protocol (Target Locking + % Force Allocation Slider + Naval Boat Attack Tax).
    state: accepted
    kind: product
    boundary: User combat interactions and action tax formulas.
    gate: GATE-003
    options_considered:
      - option: Target crosshair ring + percentage slider (1%-100%) + 1.17% land tax + 3.125% boat tax
        verdict: selected
        rationale: Authentic Territorial.io combat tax formulas and tactical force allocation controls.
      - option: Unrestricted instant area click
        verdict: rejected
        rationale: Removes tactical troop allocation and tax risk management.

  - id: DEC-005
    statement: High-Accuracy World Map Generation via SVG Vector Path Rasterization onto Canvas Uint8 Array.
    state: accepted
    kind: architecture
    boundary: World map generation engine and geographic terrain representation.
    gate: GATE-004
    options_considered:
      - option: SVG Natural Earth continent vector paths rendered to offscreen canvas and pixel-sampled into Uint8Array terrain grid
        verdict: selected
        rationale: Provides 100% accurate world geography (continents, coastlines, islands) without external server dependencies.
      - option: Procedural Perlin/Simplex noise blobs
        verdict: rejected
        rationale: Does not resemble real world geographic landmasses.

  - id: DEC-006
    statement: Full-Screen RTS Interface Layout (100vw Canvas + Glassmorphic Top Header + Floating Combat Action Bar + Minimap Navigation Widget).
    state: accepted
    kind: product
    boundary: User interface layout and interactive camera navigation.
    gate: GATE-004
    options_considered:
      - option: Full-screen 100vw x 100vh canvas viewport with glassmorphic top header, floating tactical action bar, and bottom-right interactive minimap
        verdict: selected
        rationale: Maximizes screen real estate for map navigation while providing authentic strategy/RTS game UX.
      - option: Split-screen sidebar layout
        verdict: rejected
        rationale: Restricts canvas rendering area and crowds tactical combat controls.

scope_decisions: []
