releases:
- id: REL-001
  version: 0.1.0
  name: Terra MVP Singleplayer Walking Skeleton
  is_mvp: true
  exit_criteria:
  - Player can launch singleplayer match against AI bots.
  - Canvas renders 1000x1000 pixel territory grid at >= 60 FPS.
  - Interest (0.5s), Income (5s), and 2:1 combat mechanics execute deterministically.
  - Player can conquer territory and win or lose against AI bots.
  requirements:
  - REQ-001
  - REQ-002
  - REQ-003
  - REQ-004
  batons:
  - BATON-002
  - BATON-003
  - BATON-004
  delivery_form: deployable
  status: released
- id: REL-002
  version: 0.2.0
  name: Terra Authentic Game Loop & Player Combat Controls
  is_mvp: false
  exit_criteria:
  - Main Lobby Menu allows setting Name, Color, Bot Count, Difficulty, and Map (World,
    Archipelago, Black Arena).
  - Interactive Spawn Selection Phase lets player click land location with 10s timer.
  - Player Combat Controls allow click-to-target, force slider (1%-100%), and 1.17%
    attack tax.
  - Naval Boat Attacks execute across ocean cells with 3.125% deployment tax.
  - GATE-003 automated combat test suite passes 100%.
  requirements:
  - REQ-005
  - REQ-006
  - REQ-007
  - REQ-008
  batons:
  - BATON-006
  - BATON-007
  - BATON-008
  - BATON-009
  delivery_form: deployable
  status: released
- id: REL-003
  version: 0.3.0
  name: Terra Tactical RTS UI, High-Accuracy World Map & Interactive Minimap
  is_mvp: false
  exit_criteria:
  - Players have untimed spawn position selection followed by explicit LOCK SPAWN
    and 3..2..1 GO countdown overlay.
  - World map accurately rasterizes Real World Natural Earth SVG vector continents
    into terrain grid (< 150ms).
  - Full-screen 100vw x 100vh canvas viewport with glassmorphic top header and floating
    bottom action controls.
  - Interactive bottom-right RTS minimap displays full map overview, territory colors,
    camera viewport bounds, and click/drag navigation.
  - GATE-004 benchmark evaluation passes.
  requirements:
  - REQ-009
  - REQ-010
  - REQ-011
  - REQ-012
  batons:
  - BATON-010
  - BATON-011
  - BATON-012
  - BATON-013
  - BATON-014
  delivery_form: deployable
  status: released
- id: REL-004
  version: 0.4.0
  name: Terra High-Accuracy Geography, Reliable Gesture Engine & Tactical Context
    Menu
  is_mvp: false
  exit_criteria:
  - World map accurately rasterizes detailed GeoJSON Natural Earth multi-polygon landmasses
    (> 350,000 land pixels with precise coastlines).
  - Click vs Drag gesture engine guarantees 100% reliable spawn location picking without
    camera pan misfires.
  - Canvas right-click context menu provides instant tactical commands (Attack Land,
    Send Boat, Clear Target, Lock Target).
  - GATE-005 verification test suite passes.
  requirements:
  - REQ-013
  - REQ-014
  - REQ-015
  batons:
  - BATON-015
  - BATON-016
  - BATON-017
  - BATON-018
  delivery_form: deployable
  status: released
