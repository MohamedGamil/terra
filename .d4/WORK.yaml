- id: BATON-001
  version: 1
  type: research
  title: Formalize Territorial.io Evidence Base & Discovery Governance
  objective: Document Territorial.io core mechanics, economy rules, and architecture
    evidence in D4.
  scope:
    include:
    - Analyze territorial.io mechanics
    - write EVIDENCE.yaml
    - define UNC-001/002
    - establish GATE-001/002
    exclude:
    - Production code execution
  authority:
    gates:
    - GATE-001
    - GATE-002
    requirements:
    - REQ-001
  execution:
    state: completed
    owner: mgamil.dev@gmail.com
    depends_on: []
    unblocks:
    - BATON-002
    resume_pointer: Validate .d4 YAML records via d4 validate and d4 lint.
    quadrant: Q1
    milestone: REL-001
  capabilities:
    network_policy: allowlist
    side_effect_class: A0
    approval_policy: none
  acceptance:
    deterministic_checks:
    - d4 validate pass
    - d4 lint pass
    reviewer_checks:
    - Discovery evidence verified
    required_artifacts: []
    rollback_verified: false
