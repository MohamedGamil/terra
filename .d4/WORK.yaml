requirements:
- id: REQ-001
  statement: The Terra core engine models Interest (0.5s) and Income (5s) mechanics,
    including red interest decay when balance > 100x territory land.
  kind: functional
  authorized_by:
  - DEC-001
  traces_to:
  - HY-001
  acceptance:
  - Troop balance grows per 0.5s interest tick.
  - Flat land income added per 5s cycle.
  - Interest rate decays when balance exceeds 100x territory area.
  scope_state: committed
  release: REL-001
  priority_quadrant: Q1
- id: REQ-002
  statement: Expansion & combat engine resolves player/bot territory conquest with
    2:1 defender advantage and action tax.
  kind: functional
  authorized_by:
  - DEC-001
  - DEC-002
  traces_to:
  - HY-001
  acceptance:
  - Attacking defender territory consumes attacker balance at 2:1 ratio.
  - Neutral land annexation consumes balance according to distance and tax formula.
  scope_state: committed
  release: REL-001
  priority_quadrant: Q1
- id: REQ-003
  statement: Interactive HTML5 Canvas renderer draws 1000x1000 pixel map, color-coded
    player territories, zoom/pan controls, and attack percentage UI.
  kind: functional
  authorized_by:
  - DEC-001
  traces_to:
  - HY-001
  acceptance:
  - Renderer renders territory ownership at 60 FPS.
  - Player can select target territory, adjust attack percent slider, and trigger
    attack.
  scope_state: committed
  release: REL-001
  priority_quadrant: Q1
- id: REQ-004
  statement: Singleplayer AI Bot engine controls AI expansion with configurable difficulty
    tiers (Easy, Hard, Impossible).
  kind: functional
  authorized_by:
  - DEC-001
  traces_to:
  - HY-001
  acceptance:
  - AI bots expand into neutral territory and attack neighboring targets.
  - Bot troop allocation efficiency scales with difficulty tier.
  scope_state: committed
  release: REL-001
  priority_quadrant: Q2
- id: REQ-005
  statement: Main Lobby Menu with Player Name, Color Picker, Map Selector (World,
    Archipelago, Black Arena), Bot Count, and Bot Difficulty settings.
  kind: functional
  authorized_by:
  - DEC-003
  traces_to:
  - HY-001
  acceptance:
  - Player can customize name and color before match start.
  - Player can select map layout (World, Archipelago, Black Arena).
  - Player can set bot count (10 to 500) and difficulty tier.
  scope_state: committed
  release: REL-002
  priority_quadrant: Q1
- id: REQ-006
  statement: Interactive Spawn Selection Phase displaying map grid with 10-second
    timer where player picks starting spawn location before bot spawn.
  kind: functional
  authorized_by:
  - DEC-003
  traces_to:
  - HY-001
  acceptance:
  - 10-second spawn countdown timer runs before game tick start.
  - Player clicks land pixel to place spawn marker.
  - AI bots spawn avoiding 50-pixel player spawn radius buffer.
  scope_state: committed
  release: REL-002
  priority_quadrant: Q1
- id: REQ-007
  statement: Interactive Player Combat Controls featuring target crosshair locking,
    1%-100% Force Allocation Slider, Full Send button, and 1.17% attack tax.
  kind: functional
  authorized_by:
  - DEC-004
  traces_to:
  - HY-001
  acceptance:
  - Clicking enemy/neutral land locks attack target crosshair.
  - Force slider and quick buttons (25%, 50%, 75%, Full Send) assign attack troop
    allocation.
  - Attack execution deducts 1.17% balance tax and applies 2:1 defender loss ratio.
  scope_state: committed
  release: REL-002
  priority_quadrant: Q1
- id: REQ-008
  statement: Naval Boat Attacks across water cells with 3.125% deployment tax, plus
    Win/Defeat resolution and match statistics modal.
  kind: functional
  authorized_by:
  - DEC-004
  traces_to:
  - HY-001
  acceptance:
  - Targeting across ocean cells launches naval boat transport with 3.125% deployment
    tax.
  - Game Over Victory screen displays when player conquers 100% of territory.
  - Defeat screen displays when player territory drops to 0.
  scope_state: committed
  release: REL-002
  priority_quadrant: Q1
batons:
- id: BATON-001
  version: 1
  type: research
  title: Formalize Territorial.io Evidence Base & Discovery Governance
  objective: Document Territorial.io core mechanics, economy rules, and architecture
    evidence in D4.
  scope:
    include:
    - Analyze territorial.io mechanics
    - write EVIDENCE.yaml
    - define UNC-001/002
    - establish GATE-001/002
    exclude:
    - Production code execution
  authority:
    gates:
    - GATE-001
    - GATE-002
    requirements:
    - REQ-001
  execution:
    state: completed
    owner: mgamil.dev@gmail.com
    depends_on: []
    unblocks:
    - BATON-002
    resume_pointer: Validate .d4 YAML records via d4 validate and d4 lint.
    quadrant: Q1
    milestone: REL-001
  capabilities:
    network_policy: allowlist
    side_effect_class: A0
    approval_policy: none
  acceptance:
    deterministic_checks:
    - d4 validate pass
    - d4 lint pass
    reviewer_checks:
    - Discovery evidence verified
    required_artifacts: []
    rollback_verified: false
- id: BATON-002
  version: 1
  type: implementation
  title: Build Prototypal Canvas Territory Renderer & Execute GATE-001 Benchmark
  objective: Implement 1000x1000 canvas renderer prototype to clear GATE-001 (60 FPS
    benchmark).
  scope:
    include:
    - HTML5 Canvas 2D pixel buffer renderer
    - synthetic territory expansion generator
    - FPS benchmark counter
    exclude:
    - Full multiplayer networking
  authority:
    gates:
    - GATE-001
    requirements:
    - REQ-003
  execution:
    state: completed
    owner: agent-role/frontend-implementer
    depends_on:
    - BATON-001
    unblocks:
    - BATON-003
    resume_pointer: Wait for GATE-001 execution; scaffold canvas renderer prototype
      in src/client.
    quadrant: Q1
    milestone: REL-001
  capabilities:
    network_policy: deny
    filesystem_scope:
    - src/
    side_effect_class: A1
    approval_policy: review-before-merge
  acceptance:
    deterministic_checks:
    - compile
    - lint
    - GATE-001 benchmark pass
    reviewer_checks:
    - Walkthrough written
    rollback_verified: false
