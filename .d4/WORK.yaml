releases:
- id: REL-001
  version: 0.1.0
  name: Terra MVP Singleplayer Walking Skeleton
  is_mvp: true
  exit_criteria:
  - Player can launch singleplayer match against AI bots.
  - Canvas renders 1000x1000 pixel territory grid at >= 60 FPS.
  - Interest (0.5s), Income (5s), and 2:1 combat mechanics execute deterministically.
  - Player can conquer territory and win or lose against AI bots.
  requirements:
  - REQ-001
  - REQ-002
  - REQ-003
  - REQ-004
  batons:
  - BATON-002
  - BATON-003
  - BATON-004
  delivery_form: deployable
  status: released
- id: REL-002
  version: 0.2.0
  name: Terra Authentic Game Loop & Player Combat Controls
  is_mvp: false
  exit_criteria:
  - Main Lobby Menu allows setting Name, Color, Bot Count, Difficulty, and Map (World,
    Archipelago, Black Arena).
  - Interactive Spawn Selection Phase lets player click land location with 10s timer.
  - Player Combat Controls allow click-to-target, force slider (1%-100%), and 1.17%
    attack tax.
  - Naval Boat Attacks execute across ocean cells with 3.125% deployment tax.
  - GATE-003 automated combat test suite passes 100%.
  requirements:
  - REQ-005
  - REQ-006
  - REQ-007
  - REQ-008
  batons:
  - BATON-006
  - BATON-007
  - BATON-008
  - BATON-009
  delivery_form: deployable
  status: planned
