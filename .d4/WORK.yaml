  authorized_by:
  - DEC-003
  traces_to:
  - HY-001
  acceptance:
  - Player can customize name and color before match start.
  - Player can select map layout (World, Archipelago, Black Arena).
  - Player can set bot count (10 to 500) and difficulty tier.
  scope_state: committed
  release: REL-002
  priority_quadrant: Q1
- id: REQ-006
  statement: Interactive Spawn Selection Phase displaying map grid with 10-second
    timer where player picks starting spawn location before bot spawn.
  kind: functional
  authorized_by:
  - DEC-003
  traces_to:
  - HY-001
  acceptance:
  - 10-second spawn countdown timer runs before game tick start.
  - Player clicks land pixel to place spawn marker.
  - AI bots spawn avoiding 50-pixel player spawn radius buffer.
  scope_state: committed
  release: REL-002
  priority_quadrant: Q1
- id: REQ-007
  statement: Interactive Player Combat Controls featuring target crosshair locking,
    1%-100% Force Allocation Slider, Full Send button, and 1.17% attack tax.
  kind: functional
  authorized_by:
  - DEC-004
  traces_to:
  - HY-001
  acceptance:
  - Clicking enemy/neutral land locks attack target crosshair.
  - Force slider and quick buttons (25%, 50%, 75%, Full Send) assign attack troop
    allocation.
  - Attack execution deducts 1.17% balance tax and applies 2:1 defender loss ratio.
  scope_state: committed
  release: REL-002
  priority_quadrant: Q1
- id: REQ-008
  statement: Naval Boat Attacks across water cells with 3.125% deployment tax, plus
